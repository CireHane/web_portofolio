<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
      integrity="sha512-1PKOgIY59xJ8Co8+NE6FZ+LOAZKjy+KY8iq0G4B3CyeY6wYHN3yt9PW0XpSriVlkMXe40PTKnXrLnZ9+fkDaog=="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>3D Boxes Background</title>
  </head>
  <body>
    <button id="btn" class="magic">Magic!</button>
    <div class="container">
      <div id="boxes" class="boxes big">
        <div class="box" ></div>
        <div class="box" style="background-position-x: 33%;"></div>
        <div class="box" style="background-position-x: 66%;"></div>
        <div class="box" style="background-position-x: 100%;"></div>
  
        <div class="box" style="background-position-y: 33%; "></div>
        <div class="box" style="background-position-y: 33%; background-position-x: 33%;"></div>
        <div class="box" style="background-position-y: 33%; background-position-x: 66%;"></div>
        <div class="box" style="background-position-y: 33%; background-position-x: 100%;"></div>
  
        <div class="box" style="background-position-y: 66%; "></div>
        <div class="box" style="background-position-y: 66%; background-position-x: 33%;"></div>
        <div class="box" style="background-position-y: 66%; background-position-x: 66%;"></div>
        <div class="box" style="background-position-y: 66%; background-position-x: 100%;"></div>
  
        <div class="box" style="background-position-y: 100%; "></div>
        <div class="box" style="background-position-y: 100%; background-position-x: 33%;"></div>
        <div class="box" style="background-position-y: 100%; background-position-x: 66%;"></div>
        <div class="box" style="background-position-y: 100%; background-position-x: 100%;"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
